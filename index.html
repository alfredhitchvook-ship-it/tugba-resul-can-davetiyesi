<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f2d23"><title>Tuğba & Resul Can</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"><style>:root{--green:#1f2d23;--gold:#b69a66;--paper:#f7f2e7;--ink:#332d26;--name:'Great Vibes';--body:'Cormorant Garamond'}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111}body{font-family:var(--body),serif;color:var(--ink)}.cover{position:fixed;inset:0;z-index:20;background:var(--green);overflow:hidden;perspective:1800px}.door{position:absolute;top:0;width:50%;height:100%;background:var(--green) center/cover no-repeat;transition:transform 1.5s cubic-bezier(.76,0,.18,1)}.left{left:0;transform-origin:left}.right{right:0;transform-origin:right}.opening .left{transform:rotateY(-112deg)}.opening .right{transform:rotateY(112deg)}.copy{position:absolute;z-index:3;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;color:#f0e6cf;white-space:nowrap}.ey{font:9px Montserrat;letter-spacing:4px}.nm{font:56px var(--name),cursive;margin:8px}.amp{color:var(--gold);font-size:30px}.branch{color:var(--gold);font-size:26px}.seal{position:absolute;z-index:5;left:calc(50% + var(--sx,0px));top:calc(50% + var(--sy,0px));width:var(--ss,128px);height:var(--ss,128px);transform:translate(-50%,-50%);border:0;background:transparent;box-shadow:none;padding:0;cursor:pointer}.seal img{display:block;width:100%;height:100%;object-fit:contain}.hint{position:absolute;bottom:25px;left:0;right:0;text-align:center;color:#eadfc8;font:9px Montserrat;letter-spacing:3px}.inv{min-height:100vh;background:var(--paper)}.paper{max-width:680px;min-height:100vh;margin:auto;padding:25px 14px 50px;display:flex;align-items:center}.card{width:100%;padding:45px 22px;text-align:center;background:#faf7ef;border:1px solid #b69a6655}.orn{color:var(--gold);font-size:30px}.script{font:68px var(--name),cursive}.msg{font-size:18px;line-height:1.6;max-width:500px;margin:24px auto}.rule{width:150px;height:1px;background:var(--gold);margin:22px auto}.info{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid #b69a6655;margin:25px auto}.box{padding:18px 8px}.box+.box{border-left:1px solid #b69a6655}.action{display:inline-block;margin-top:22px;padding:11px 18px;border:1px solid var(--gold);color:#675338;text-decoration:none;font:9px Montserrat;letter-spacing:2px}@media(max-width:600px){.nm{font-size:43px}.ey{font-size:7px}.script{font-size:56px}.card{padding:38px 16px}.msg{font-size:17px}.info{grid-template-columns:1fr}.box+.box{border-left:0;border-top:1px solid #b69a6655}}@media(prefers-reduced-motion:reduce){.door{transition:none}}</style></head><body><section class="cover" id="cover"><div class="door left" id="left"></div><div class="door right" id="right"></div><div class="copy"><div class="ey" id="kicker">NİŞAN DAVETİYESİ</div><div class="nm" id="bride">Tuğba</div><div class="amp">&amp;</div><div class="nm" id="groom">Resul Can</div><div class="branch">❧</div></div><button class="seal" id="seal" aria-label="Daveti aç"><img id="sealImg" alt="Mühür"></button><div class="hint">MÜHRE DOKUNUN<br><br>DAVETİ AÇ</div></section><main class="inv"><div class="paper"><article class="card"><div class="orn">❦</div><div id="innerKicker"></div><div class="script" id="innerBride"></div><div>&amp;</div><div class="script" id="innerGroom"></div><div class="msg" id="message"></div><div class="rule"></div><div id="date"></div><div id="time"></div><div class="info"><div class="box"><b>TARİH</b><br><span id="day"></span></div><div class="box"><b>SAAT</b><br><span id="time2"></span></div><div class="box"><b>MEKÂN</b><br><span id="venue"></span></div></div><div id="address"></div><a class="action" id="map" target="_blank">YOL TARİFİ AL</a></article></div></main><script>const D={bride:'Tuğba',groom:'Resul Can',kicker:'NİŞAN DAVETİYESİ',message:'Sizleri de aramızda görmekten mutluluk duyarız.',date:'2026-10-29',time:'19:00',venue:'Velora Davet Evi',address:'Macera Park, 2. Coşkun Sk. · M Blok No:13',map:'https://www.google.com/maps/search/?api=1&query=Velora+Davet+Evi+Macera+Park+2+Coskun+Sk+M+Blok+No+13',coverColor:'#1f2d23',goldColor:'#b69a66',paperColor:'#f7f2e7',textColor:'#332d26',nameFont:'Great Vibes',bodyFont:'Cormorant Garamond',coverPattern:'',sealPattern:'',sealSize:128,sealX:0,sealY:0};let d={...D,...JSON.parse(localStorage.getItem('tugbaInvite')||'{}')};const $=x=>document.getElementById(x);function apply(){let r=document.documentElement.style;r.setProperty('--green',d.coverColor);r.setProperty('--gold',d.goldColor);r.setProperty('--paper',d.paperColor||D.paperColor);r.setProperty('--ink',d.textColor||D.textColor);r.setProperty('--name',`'${d.nameFont}'`);r.setProperty('--body',`'${d.bodyFont}'`);r.setProperty('--sx',(d.sealX||0)+'px');r.setProperty('--sy',(d.sealY||0)+'px');r.setProperty('--ss',(d.sealSize||128)+'px');$('left').style.backgroundImage=d.coverPattern?`url(${d.coverPattern})`:'none';$('right').style.backgroundImage=d.coverPattern?`url(${d.coverPattern})`:'none';$('sealImg').src=d.sealPattern||'';$('sealImg').style.display=d.sealPattern?'block':'none';['bride','groom','innerBride','innerGroom'].forEach(x=>$(x).textContent=d[x==='innerBride'||x==='innerGroom'?x.replace('inner','').toLowerCase():x]);$('kicker').textContent=d.kicker;$('innerKicker').textContent=d.kicker;$('message').textContent=d.message;$('venue').textContent=d.venue;$('address').textContent=d.address;$('time').textContent=d.time;$('time2').textContent=d.time;$('map').href=d.map;let x=new Date(d.date+'T12:00:00'),months=['OCAK','ŞUBAT','MART','NİSAN','MAYIS','HAZİRAN','TEMMUZ','AĞUSTOS','EYLÜL','EKİM','KASIM','ARALIK'];$('date').textContent=`${String(x.getDate()).padStart(2,'0')} ${months[x.getMonth()]} ${x.getFullYear()}`;$('day').textContent=`${String(x.getDate()).padStart(2,'0')} ${months[x.getMonth()]}`}apply();$('seal').onclick=()=>{$('cover').classList.add('opening');setTimeout(()=>$('cover').style.display='none',1500)}</script></body></html>
