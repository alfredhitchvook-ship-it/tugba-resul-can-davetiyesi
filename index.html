<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tuğba & Resul Can — Nişan Davetiyesi</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Playfair+Display:wght@400;500&family=Cinzel:wght@400;500&family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"><style>:root{--green:#1f2d23;--gold:#b69a66;--paper:#f7f2e7;--bodyfont:'Cormorant Garamond';--namefont:'Great Vibes';--cover-pattern:none;--seal-size:128px;--seal-x:0px;--seal-y:0px;--eyebrow-y:0px;--names-y:0px;--amp-y:0px;--branch-y:0px;--text-x:0px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111a14;color:#3c352c}body{font-family:var(--bodyfont),serif}.cover-screen{position:fixed;inset:0;z-index:50;background:var(--green);perspective:1800px;overflow:hidden}.cover-half{position:absolute;top:0;width:50%;height:100%;overflow:hidden;background-color:var(--green);background-image:var(--cover-pattern);background-position:center;background-size:cover;box-shadow:0 0 35px #0006;transition:transform 1.65s cubic-bezier(.76,0,.18,1)}.cover-left{left:0;transform-origin:left center}.cover-right{right:0;transform-origin:right center}.opening .cover-left{transform:rotateY(-112deg)}.opening .cover-right{transform:rotateY(112deg)}.cover-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.cover-copy{text-align:center;color:#f0e6cf;text-shadow:0 2px 12px #0008;transform:translateX(var(--text-x))}.eyebrow{font:10px Montserrat;letter-spacing:5px;margin-bottom:18px;transform:translateY(var(--eyebrow-y))}.names{font-family:var(--bodyfont),serif;font-size:58px;font-weight:500;transform:translateY(var(--names-y))}.amp{font:35px var(--bodyfont);color:var(--gold);margin:7px;transform:translateY(var(--amp-y))}.branch{color:var(--gold);font-size:27px;transform:translateY(var(--branch-y))}.seal-button{position:absolute;z-index:10;left:calc(50% + var(--seal-x));top:calc(50% + var(--seal-y));width:var(--seal-size);height:var(--seal-size);transform:translate(-50%,-50%);border:0;border-radius:50%;cursor:pointer;background:#eee7d8;box-shadow:0 8px 35px #0009,inset 0 0 0 5px #e0d5bd;display:grid;place-items:center}.seal-button:before{content:'';width:66%;height:66%;border-radius:50%;border:1px solid #b9a174;background:#f6f0e4;box-shadow:inset 0 0 18px #66532f1f}.seal-flower{position:absolute;width:60%;height:60%;border-radius:50%;background:center/contain no-repeat;color:var(--gold);font-size:46px;line-height:1;text-align:center}.seal-hint{position:absolute;bottom:30px;left:0;right:0;text-align:center;color:#e9ddc4;font:9px Montserrat;letter-spacing:3px}.seal-hint span{display:block;margin-top:8px;color:#c7b48d;letter-spacing:1px}.invitation{min-height:100vh;background:radial-gradient(ellipse at 10% 10%,#ad96691f,transparent 26%),radial-gradient(ellipse at 90% 20%,#ad966919,transparent 24%),repeating-radial-gradient(ellipse at 50% 50%,transparent 0 28px,#a9936810 29px 30px,transparent 31px 48px),var(--paper)}.paper{max-width:680px;min-height:100vh;margin:auto;padding:55px 28px 70px;display:flex;align-items:center;justify-content:center}.card{width:100%;padding:52px 42px;text-align:center;background:#faf7efc7;border:1px solid #a98e5c73;box-shadow:0 25px 70px #4e3d261f}.ornament{color:var(--gold);font-size:32px}.kicker{font:9px Montserrat;letter-spacing:4px;color:#7f6a4a}.script-name,.footer .small-script{font-family:var(--namefont),cursive}.script-name{font-size:72px;line-height:.95;color:#332d26;margin:14px 0}.amp2{font:31px var(--bodyfont);color:#a48652}.invite-title{font:15px Montserrat;letter-spacing:3px;margin-top:15px}.message{font-size:19px;line-height:1.65;max-width:480px;margin:25px auto}.rule{width:160px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:23px auto}.date{font:14px Montserrat;letter-spacing:2px}.time{font-size:20px;margin-top:7px}.info-row{display:grid;grid-template-columns:repeat(3,1fr);max-width:520px;margin:28px auto 0;border-top:1px solid #a98e5c66;border-bottom:1px solid #a98e5c66}.info{padding:20px 10px;min-height:125px;display:flex;flex-direction:column;align-items:center;justify-content:center}.info+.info{border-left:1px solid #a98e5c66}.icon{font-size:24px}.info-label{font:8px Montserrat;letter-spacing:2px;color:#857154}.info-value{font-size:17px;margin-top:6px}.info-small{font-size:13px;color:#665c50}.countdown{margin:26px auto;display:grid;grid-template-columns:repeat(4,1fr);max-width:480px;gap:6px}.time-box{padding:10px 3px;border:1px solid #a98e5c59}.time-box b{display:block;font-size:24px}.time-box span{font:7px Montserrat;letter-spacing:1px}.action{display:inline-flex;padding:12px 18px;border:1px solid var(--gold);color:#6b5638;text-decoration:none;font:9px Montserrat;letter-spacing:2px}.note{margin-top:27px;font-size:17px;line-height:1.6}.footer .small-script{font-size:40px;color:#a48652}.footer p{font-size:16px}@media(max-width:600px){.names{font-size:45px}.paper{padding:28px 16px 50px}.card{padding:44px 20px}.script-name{font-size:58px}.message{font-size:17px}.info-row{grid-template-columns:1fr}.info+.info{border-left:0;border-top:1px solid #a98e5c59}.countdown{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){.cover-half{transition:none}}</style></head><body><section class="cover-screen" id="cover"><div class="cover-half cover-left"></div><div class="cover-half cover-right"></div><div class="cover-inner"><div class="cover-copy"><div class="eyebrow">NİŞAN DAVETİYESİ</div><div class="names" id="coverBride">Tuğba</div><div class="amp">&amp;</div><div class="names" id="coverGroom">Resul Can</div><div class="branch">❧</div></div></div><button class="seal-button" id="seal"><span class="seal-flower" id="sealPattern">✿</span></button><div class="seal-hint">MÜHRE DOKUNUN<span>DAVETİ AÇ</span></div></section><main class="invitation"><div class="paper"><article class="card"><div class="ornament">❦</div><div class="kicker" id="innerKicker">BİRLİKTE DAHA GÜZEL</div><div class="script-name" id="innerBride">Tuğba</div><div class="amp2">&amp;</div><div class="script-name" id="innerGroom">Resul Can</div><div class="invite-title">EN ÖZEL GÜNÜMÜZDE</div><div class="message" id="message"></div><div class="rule"></div><div class="date" id="dateText"></div><div class="time" id="timeText"></div><div class="info-row"><div class="info"><div class="icon">▦</div><div class="info-label">TARİH</div><div class="info-value" id="dayText"></div><div class="info-small" id="weekdayText"></div></div><div class="info"><div class="icon">◷</div><div class="info-label">SAAT</div><div class="info-value" id="timeInfo"></div></div><div class="info"><div class="icon">⌖</div><div class="info-label">MEKÂN</div><div class="info-value" id="venueText"></div></div></div><div class="info-small" id="addressText"></div><div class="countdown" id="countdown"><div class="time-box"><b>--</b><span>Gün</span></div><div class="time-box"><b>--</b><span>Saat</span></div><div class="time-box"><b>--</b><span>Dakika</span></div><div class="time-box"><b>--</b><span>Saniye</span></div></div><a class="action" id="mapLink" target="_blank">YOL TARİFİ AL</a><div class="note" id="note"></div><div class="rule"></div><div class="footer"><div class="small-script" id="footerNames"></div><p id="footerDate"></p></div></article></div></main><script>const D={bride:'Tuğba',groom:'Resul Can',kicker:'BİRLİKTE DAHA GÜZEL',message:'Sizleri de aramızda görmekten mutluluk duyarız.',note:'Bu güzel günde sizleri de yanımızda görmekten büyük mutluluk duyacağız.',date:'2026-10-29',time:'19:00',venue:'Velora Davet Evi',address:'Macera Park, 2. Coşkun Sk. · M Blok No:13',map:'https://www.google.com/maps/search/?api=1&query=Velora+Davet+Evi+Macera+Park+2+Coskun+Sk+M+Blok+No+13',coverColor:'#1f2d23',goldColor:'#b69a66',nameFont:'Great Vibes',bodyFont:'Cormorant Garamond',coverPattern:'',sealPattern:'',sealSize:128,sealX:0,sealY:0,eyebrowY:0,namesY:0,ampY:0,branchY:0,textX:0};let d={...D,...JSON.parse(localStorage.getItem('tugbaInvite')||'{}')};const $=i=>document.getElementById(i);function apply(){let r=document.documentElement.style;r.setProperty('--green',d.coverColor||D.coverColor);r.setProperty('--gold',d.goldColor||D.goldColor);r.setProperty('--bodyfont',`'${d.bodyFont||D.bodyFont}'`);r.setProperty('--namefont',`'${d.nameFont||D.nameFont}'`);r.setProperty('--cover-pattern',d.coverPattern?`url(${d.coverPattern})`:'none');r.setProperty('--seal-size',(d.sealSize||128)+'px');r.setProperty('--seal-x',(d.sealX||0)+'px');r.setProperty('--seal-y',(d.sealY||0)+'px');r.setProperty('--eyebrow-y',(d.eyebrowY||0)+'px');r.setProperty('--names-y',(d.namesY||0)+'px');r.setProperty('--amp-y',(d.ampY||0)+'px');r.setProperty('--branch-y',(d.branchY||0)+'px');r.setProperty('--text-x',(d.textX||0)+'px');if(d.sealPattern){$('sealPattern').textContent='';$('sealPattern').style.backgroundImage=`url(${d.sealPattern})`}else{$('sealPattern').style.backgroundImage='';$('sealPattern').textContent='✿'}$('coverBride').textContent=d.bride;$('coverGroom').textContent=d.groom;$('innerBride').textContent=d.bride;$('innerGroom').textContent=d.groom;$('innerKicker').textContent=d.kicker;$('message').textContent=d.message;$('note').textContent=d.note;let x=new Date(d.date+'T12:00:00'),m=['OCAK','ŞUBAT','MART','NİSAN','MAYIS','HAZİRAN','TEMMUZ','AĞUSTOS','EYLÜL','EKİM','KASIM','ARALIK'],w=['PAZAR','PAZARTESİ','SALI','ÇARŞAMBA','PERŞEMBE','CUMA','CUMARTESİ'];$('dateText').textContent=`${String(x.getDate()).padStart(2,'0')} ${m[x.getMonth()]} ${x.getFullYear()} · ${w[x.getDay()]}`;$('dayText').textContent=`${String(x.getDate()).padStart(2,'0')} ${m[x.getMonth()]}`;$('weekdayText').textContent=w[x.getDay()];$('timeText').textContent=d.time;$('timeInfo').textContent=d.time;$('venueText').textContent=d.venue;$('addressText').textContent=d.address;$('mapLink').href=d.map;$('footerNames').textContent=d.bride+' & '+d.groom;$('footerDate').textContent=`${String(x.getDate()).padStart(2,'0')} · ${String(x.getMonth()+1).padStart(2,'0')} · ${x.getFullYear()}`}function tick(){let t=new Date(d.date+'T'+d.time+':00+03:00').getTime(),s=Math.max(0,Math.floor((t-Date.now())/1000)),v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];document.querySelectorAll('#countdown b').forEach((e,i)=>e.textContent=String(v[i]).padStart(2,'0'))}apply();tick();setInterval(tick,1000);$('seal').onclick=()=>{$('cover').classList.add('opening');setTimeout(()=>{$('cover').style.display='none';window.scrollTo(0,0)},1500)}</script></body></html>
