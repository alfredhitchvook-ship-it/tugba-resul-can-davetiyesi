<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasarım Yönetimi</title><style>body{margin:0;background:#1f2d23;color:#f3ead8;font-family:Georgia,serif}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.panel{background:#f6f0e3;color:#40382f;padding:25px;border-radius:5px}.hide{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font:11px Arial;letter-spacing:1px;text-transform:uppercase;color:#765f42}input,select{width:100%;box-sizing:border-box;margin-top:6px;padding:10px;border:1px solid #cbb990;background:#fffdf8}.full{grid-column:1/-1}.tabs{display:flex;gap:8px;margin:18px 0}.tab{flex:1;padding:13px;background:#fff;border:1px solid #cbb990;color:#6f5937}.tab.active{background:#a88b55;color:#fff}.section{display:none}.section.active{display:block}.btn{width:100%;margin-top:14px;padding:13px;background:#a88b55;color:white;border:0;cursor:pointer}.secondary{background:transparent;color:#6f5937;border:1px solid #a88b55}.range{display:grid;grid-template-columns:110px 1fr 50px;gap:8px;align-items:center;margin:9px 0;font:11px Arial}.range input{margin:0;padding:0}.live{margin-top:20px}.phone{height:650px;max-width:400px;margin:auto;border:7px solid #29251f;border-radius:25px;overflow:hidden}.phone iframe{width:100%;height:100%;border:0}.ok{padding:10px;background:#e5ecd9;margin-top:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.phone{height:600px}}</style></head><body><div class="wrap"><div class="panel" id="login"><h1>Tuğba & Resul Can</h1><p>Yönetim Paneli</p><input id="pass" type="password" placeholder="Yönetici şifresi"><button class="btn" id="loginBtn">GİRİŞ YAP</button><p id="err"></p></div><div class="panel hide" id="editor"><h1>Davetiyeyi Yönet</h1><div class="tabs"><button class="tab active" data-s="content">DAVETİYE</button><button class="tab" data-s="design">🎨 TASARIM AYARLARI</button></div><section id="content" class="section active"><div class="grid"><label>Gelin adı<input id="bride"></label><label>Damat adı<input id="groom"></label><label>Üst başlık<input id="kicker"></label><label>Tarih<input id="date" type="date"></label><label>Saat<input id="time" type="time"></label><label>Mekân<input id="venue"></label><label class="full">Mesaj<input id="message"></label><label class="full">Adres<input id="address"></label><label class="full">Harita<input id="map"></label></div></section><section id="design" class="section"><div class="grid"><label>Kapak rengi<input id="coverColor" type="color"></label><label>Altın / vurgu rengi<input id="goldColor" type="color"></label><label>Kâğıt / iç sayfa rengi<input id="paperColor" type="color"></label><label>✏️ YAZI RENGİ<input id="textColor" type="color"></label><label>İsim fontu<select id="nameFont"><option>Great Vibes</option><option>Cormorant Garamond</option><option>Playfair Display</option><option>Cinzel</option><option>Libre Baskerville</option></select></label><label>Normal font<select id="bodyFont"><option>Cormorant Garamond</option><option>Montserrat</option><option>Playfair Display</option><option>Libre Baskerville</option><option>Georgia</option></select></label><label class="full">Kapak deseni<input id="coverPattern" type="file" accept="image/*"></label><label class="full">Mühür sembolü — SADECE YÜKLEDİĞİN GÖRSEL<input id="sealPattern" type="file" accept="image/*"><small>Ekstra yuvarlak/amblem yok.</small></label></div><div style="border:1px solid #cbb990;padding:14px;margin-top:15px"><b>MÜHÜR BOYUTU / YERİ</b><div class="range">Boyut<input id="sealSize" type="range" min="40" max="220"><output id="sealSizeOut"></output></div><div class="range">Yatay<input id="sealX" type="range" min="-250" max="250"><output id="sealXOut"></output></div><div class="range">Dikey<input id="sealY" type="range" min="-300" max="300"><output id="sealYOut"></output></div><b>YAZI YERİ</b><div class="range">Genel yatay<input id="textX" type="range" min="-250" max="250"><output id="textXOut"></output></div><div class="range">Başlık Y<input id="eyebrowY" type="range" min="-250" max="250"><output id="eyebrowYOut"></output></div><div class="range">İsimler Y<input id="namesY" type="range" min="-250" max="250"><output id="namesYOut"></output></div><div class="range">& Y<input id="ampY" type="range" min="-250" max="250"><output id="ampYOut"></output></div><div class="range">Dal Y<input id="branchY" type="range" min="-250" max="250"><output id="branchYOut"></output></div></div><div class="live"><h3>CANLI ÖNİZLEME</h3><div class="phone"><iframe id="frame" src="./?preview=1"></iframe></div></div></section><button class="btn" id="save">KAYDET</button><button class="btn secondary" id="reset">VARSAYILANLARA DÖN</button><div id="ok"></div></div></div><script>const P='TUĞBA2026',D={bride:'Tuğba',groom:'Resul Can',kicker:'NİŞAN DAVETİYESİ',message:'Sizleri de aramızda görmekten mutluluk duyarız.',date:'2026-10-29',time:'19:00',venue:'Velora Davet Evi',address:'Macera Park, 2. Coşkun Sk. · M Blok No:13',map:'https://www.google.com/maps/search/?api=1&query=Velora+Davet+Evi',coverColor:'#1f2d23',goldColor:'#b69a66',paperColor:'#f7f2e7',textColor:'#332d26',nameFont:'Great Vibes',bodyFont:'Cormorant Garamond',coverPattern:'',sealPattern:'',sealSize:128,sealX:0,sealY:0,textX:0,eyebrowY:0,namesY:0,ampY:0,branchY:0};let d={...D,...JSON.parse(localStorage.getItem('tugbaInvite')||'{}')};const $=i=>document.getElementById(i),R=['sealSize','sealX','sealY','textX','eyebrowY','namesY','ampY','branchY'];function fill(){Object.keys(d).forEach(k=>{$(k)&&$(k).type!=='file'&&($(k).value=d[k])});R.forEach(k=>$(k+'Out').textContent=$(k).value+' px');push()}function push(){localStorage.setItem('tugbaInvite',JSON.stringify(d));if($('frame'))$('frame').contentWindow.location.reload()}$('loginBtn').onclick=()=>{if($('pass').value===P){$('login').classList.add('hide');$('editor').classList.remove('hide');fill()}else $('err').textContent='Şifre hatalı.'};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.s).classList.add('active')});document.querySelectorAll('input,select').forEach(e=>{if(e.type==='file')return;e.oninput=()=>{d[e.id]=e.type==='range'?Number(e.value):e.value;$(e.id+'Out')&&($(e.id+'Out').textContent=e.value+' px');push()}});function img(e,k){if(!e.files[0])return;let r=new FileReader();r.onload=()=>{d[k]=r.result;push()};r.readAsDataURL(e.files[0])}$('coverPattern').onchange=e=>img(e.target,'coverPattern');$('sealPattern').onchange=e=>img(e.target,'sealPattern');$('save').onclick=()=>{$('ok').className='ok';$('ok').textContent='Kaydedildi. Yazı rengi de dahil tüm tasarım ayarları kaydedildi.'};$('reset').onclick=()=>{d={...D};localStorage.removeItem('tugbaInvite');fill()};</script></body></html>
