<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Davet Yönetimi</title><style>body{margin:0;background:#1f2d23;color:#f3ead8;font-family:Georgia,serif}.wrap{max-width:760px;margin:auto;padding:28px 18px 60px}.panel{background:#f6f0e3;color:#40382f;border-radius:4px;padding:28px;box-shadow:0 20px 60px #0006}h1{font-weight:400;text-align:center;color:#6f5937}.sub{text-align:center;color:#776a58;margin-bottom:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{font:11px Arial;letter-spacing:1px;text-transform:uppercase;color:#76644a}input,textarea{width:100%;margin-top:7px;padding:12px;border:1px solid #cbb990;background:#fffdf8;color:#3c352c;box-sizing:border-box}textarea{min-height:100px;resize:vertical}.full{grid-column:1/-1}.btn{margin-top:22px;width:100%;padding:14px;border:1px solid #a88b55;background:#a88b55;color:white;cursor:pointer;font:12px Arial;letter-spacing:2px}.secondary{background:transparent;color:#6f5937}.error{color:#a33;text-align:center;margin:12px}.login{max-width:390px;margin:15vh auto}.hide{display:none}.ok{padding:12px;background:#e5ecd9;margin-top:15px;text-align:center}.back{display:block;text-align:center;margin-top:18px;color:#d9c59a}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="panel login" id="login"><h1>Tuğba & Resul Can</h1><div class="sub">Yönetim Paneli</div><input id="pass" type="password" placeholder="Yönetici şifresi"><button class="btn" id="loginBtn">GİRİŞ YAP</button><div class="error" id="err"></div></div><div class="panel hide" id="editor"><h1>Davetiyeyi Düzenle</h1><div class="sub">Değişiklikler bu cihazın tarayıcısında saklanır.</div><div class="grid"><label>Gelin adı<input id="bride"></label><label>Damat adı<input id="groom"></label><label>Üst başlık<input id="kicker"></label><label>Tarih<input id="date" type="date"></label><label>Saat<input id="time" type="time"></label><label>Mekân<input id="venue"></label><label class="full">Adres<input id="address"></label><label class="full">Davet mesajı<textarea id="message"></textarea></label><label class="full">Alt mesaj<textarea id="note"></textarea></label><label class="full">Harita bağlantısı<input id="map"></label></div><button class="btn" id="save">DEĞİŞİKLİKLERİ KAYDET</button><button class="btn secondary" id="reset">VARSAYILANLARA DÖN</button><div id="ok"></div><a class="back" href="./">← Davetiyeyi aç</a></div></div><script>const PASSWORD="TUĞBA2026";const defaults={bride:"Tuğba",groom:"Resul Can",kicker:"BİRLİKTE DAHA GÜZEL",message:"Sizleri de aramızda görmekten mutluluk duyarız.",note:"Bu güzel günde sizleri de yanımızda görmekten büyük mutluluk duyacağız.",date:"2026-10-29",time:"19:00",venue:"Velora Davet Evi",address:"Macera Park, 2. Coşkun Sk. · M Blok No:13",map:"https://www.google.com/maps/search/?api=1&query=Velora+Davet+Evi+Macera+Park+2+Coskun+Sk+M+Blok+No+13"};let d={...defaults,...JSON.parse(localStorage.getItem('tugbaInvite')||'{}')};const $=x=>document.getElementById(x);function fill(){Object.keys(d).forEach(k=>{if($(k))$(k).value=d[k]})}function show(){ $('login').classList.add('hide');$('editor').classList.remove('hide');fill()}$('loginBtn').onclick=()=>{if($('pass').value===PASSWORD){sessionStorage.admin='1';show()}else $('err').textContent='Şifre hatalı.'};if(sessionStorage.admin==='1')show();$('save').onclick=()=>{Object.keys(d).forEach(k=>{if($(k))d[k]=$(k).value});localStorage.setItem('tugbaInvite',JSON.stringify(d));$('ok').className='ok';$('ok').textContent='Kaydedildi. Davetiye sayfasını yenileyin.'};$('reset').onclick=()=>{d={...defaults};localStorage.removeItem('tugbaInvite');fill();$('ok').className='ok';$('ok').textContent='Varsayılan bilgiler geri yüklendi.'};</script></body></html>
