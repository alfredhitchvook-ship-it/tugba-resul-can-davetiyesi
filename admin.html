<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Davet Yönetimi</title><style>body{margin:0;background:#1f2d23;color:#f3ead8;font-family:Georgia,serif}.wrap{max-width:900px;margin:auto;padding:28px 18px 60px}.panel{background:#f6f0e3;color:#40382f;border-radius:4px;padding:28px;box-shadow:0 20px 60px #0006}h1{font-weight:400;text-align:center;color:#6f5937}.sub{text-align:center;color:#776a58;margin-bottom:24px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{flex:1;padding:13px;border:1px solid #cbb990;background:#fffdf8;color:#6f5937;cursor:pointer;letter-spacing:1px}.tab.active{background:#a88b55;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{font:11px Arial;letter-spacing:1px;text-transform:uppercase;color:#76644a}input,textarea,select{width:100%;margin-top:7px;padding:12px;border:1px solid #cbb990;background:#fffdf8;color:#3c352c;box-sizing:border-box}textarea{min-height:100px;resize:vertical}.full{grid-column:1/-1}.btn{margin-top:22px;width:100%;padding:14px;border:1px solid #a88b55;background:#a88b55;color:white;cursor:pointer;font:12px Arial;letter-spacing:2px}.secondary{background:transparent;color:#6f5937}.error{color:#a33;text-align:center;margin:12px}.login{max-width:390px;margin:15vh auto}.hide{display:none}.ok{padding:12px;background:#e5ecd9;margin-top:15px;text-align:center}.back{display:block;text-align:center;margin-top:18px;color:#d9c59a}.hint{font:12px Arial;line-height:1.5;color:#756957;background:#eee5d4;padding:12px;margin-top:8px}.color-row{display:flex;gap:10px;align-items:end}.color-row label{flex:1}.color-row input[type=color]{height:42px;padding:4px}.preview{height:140px;border:1px solid #cbb990;margin-top:16px;background:#1f2d23 center/cover no-repeat;display:grid;place-items:center;color:#f3ead8;font:30px Georgia}.design-section{display:none}.design-section.active{display:block}.upload{padding:12px;border:1px dashed #b9a67f;background:#fffaf0}.small-btn{width:auto;margin-top:8px;padding:9px 12px}</style></head><body><div class="wrap"><div class="panel login" id="login"><h1>Tuğba & Resul Can</h1><div class="sub">Yönetim Paneli</div><input id="pass" type="password" placeholder="Yönetici şifresi"><button class="btn" id="loginBtn">GİRİŞ YAP</button><div class="error" id="err"></div></div><div class="panel hide" id="editor"><h1>Davetiyeyi Yönet</h1><div class="sub">Metin ve tasarım ayarlarını buradan düzenleyebilirsiniz.</div><div class="tabs"><button class="tab active" data-tab="content">✦ DAVETİYE BİLGİLERİ</button><button class="tab" data-tab="design">🎨 TASARIM AYARLARI</button></div><section id="content" class="design-section active"><div class="grid"><label>Gelin adı<input id="bride"></label><label>Damat adı<input id="groom"></label><label>Üst başlık<input id="kicker"></label><label>Tarih<input id="date" type="date"></label><label>Saat<input id="time" type="time"></label><label>Mekân<input id="venue"></label><label class="full">Adres<input id="address"></label><label class="full">Davet mesajı<textarea id="message"></textarea></label><label class="full">Alt mesaj<textarea id="note"></textarea></label><label class="full">Harita bağlantısı<input id="map"></label></div></section><section id="design" class="design-section"><div class="grid"><label>Kapak rengi<input id="coverColor" type="color"></label><label>Altın rengi<input id="goldColor" type="color"></label><label>İsim fontu<select id="nameFont"><option value="Great Vibes">Great Vibes</option><option value="Cormorant Garamond">Cormorant Garamond</option><option value="Playfair Display">Playfair Display</option><option value="Cinzel">Cinzel</option><option value="Libre Baskerville">Libre Baskerville</option></select></label><label>Normal yazı fontu<select id="bodyFont"><option value="Cormorant Garamond">Cormorant Garamond</option><option value="Montserrat">Montserrat</option><option value="Playfair Display">Playfair Display</option><option value="Libre Baskerville">Libre Baskerville</option><option value="Georgia">Georgia</option></select></label><label class="full">Kapak / zarf deseni<div class="upload"><input id="coverPattern" type="file" accept="image/*"><div class="hint">PNG/JPG/WebP yükleyebilirsiniz. Görsel yalnızca bu tarayıcıda saklanır.</div><button class="btn small-btn secondary" type="button" id="clearPattern">DESENİ KALDIR</button></div></label><label class="full">Mühür deseni<div class="upload"><input id="sealPattern" type="file" accept="image/*"><div class="hint">Mühürün ortasındaki deseni değiştirebilirsiniz. Şeffaf PNG önerilir.</div><button class="btn small-btn secondary" type="button" id="clearSeal">MÜHÜR DESENİNİ KALDIR</button></div></label></div><div class="preview" id="preview">Önizleme</div></section><button class="btn" id="save">DEĞİŞİKLİKLERİ KAYDET</button><button class="btn secondary" id="reset">VARSAYILANLARA DÖN</button><div id="ok"></div><a class="back" href="./">← Davetiyeyi aç</a></div></div><script>const PASSWORD="TUĞBA2026";const defaults={bride:"Tuğba",groom:"Resul Can",kicker:"BİRLİKTE DAHA GÜZEL",message:"Sizleri de aramızda görmekten mutluluk duyarız.",note:"Bu güzel günde sizleri de yanımızda görmekten büyük mutluluk duyacağız.",date:"2026-10-29",time:"19:00",venue:"Velora Davet Evi",address:"Macera Park, 2. Coşkun Sk. · M Blok No:13",map:"https://www.google.com/maps/search/?api=1&query=Velora+Davet+Evi+Macera+Park+2+Coskun+Sk+M+Blok+No+13",coverColor:"#1f2d23",goldColor:"#b69a66",nameFont:"Great Vibes",bodyFont:"Cormorant Garamond",coverPattern:"",sealPattern:""};let d={...defaults,...JSON.parse(localStorage.getItem('tugbaInvite')||'{}')};const $=x=>document.getElementById(x);function fill(){Object.keys(d).forEach(k=>{if($(k)&&$(k).type!=='file')$(k).value=d[k]});preview()}function show(){ $('login').classList.add('hide');$('editor').classList.remove('hide');fill()}function preview(){let p=$("preview");p.style.backgroundColor=d.coverColor||defaults.coverColor;p.style.color=d.goldColor||defaults.goldColor;p.style.fontFamily=d.nameFont||defaults.nameFont;if(d.coverPattern)p.style.backgroundImage=`url(${d.coverPattern})`;else p.style.backgroundImage='none'}$("loginBtn").onclick=()=>{if($("pass").value===PASSWORD){sessionStorage.admin='1';show()}else $("err").textContent='Şifre hatalı.'};if(sessionStorage.admin==='1')show();document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.design-section').forEach(x=>x.classList.remove('active'));t.classList.add('active');$(t.dataset.tab).classList.add('active')});function readImage(input,key){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{d[key]=r.result;preview()};r.readAsDataURL(f)}$("coverPattern").onchange=()=>readImage($("coverPattern"),'coverPattern');$("sealPattern").onchange=()=>readImage($("sealPattern"),'sealPattern');$("clearPattern").onclick=()=>{d.coverPattern='';$("coverPattern").value='';preview()};$("clearSeal").onclick=()=>{d.sealPattern='';$("sealPattern").value='';preview()};$("coverColor").oninput=()=>{d.coverColor=$("coverColor").value;preview()};$("goldColor").oninput=()=>{d.goldColor=$("goldColor").value;preview()};$("nameFont").onchange=()=>{d.nameFont=$("nameFont").value;preview()};$("bodyFont").onchange=()=>{d.bodyFont=$("bodyFont").value;preview()};$("save").onclick=()=>{Object.keys(d).forEach(k=>{if($(k)&&$(k).type!=='file')d[k]=$(k).value||d[k]});localStorage.setItem('tugbaInvite',JSON.stringify(d));$("ok").className='ok';$("ok").textContent='Kaydedildi. Davetiye sayfasını yenileyin.'};$("reset").onclick=()=>{d={...defaults};localStorage.removeItem('tugbaInvite');fill();$("ok").className='ok';$("ok").textContent='Varsayılan ayarlar geri yüklendi.'};</script></body></html>
